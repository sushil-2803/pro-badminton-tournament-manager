services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: badminton_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=smash-brackets-super-secret-key-change-me
      - DATABASE_PATH=/app/data/database.sqlite
    volumes:
      # Bind mount stores the sqlite db directly in host directory backend/data/ for absolute developer visibility
      - ./backend/data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: badminton_frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
